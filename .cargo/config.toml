# Pin the FMA instruction on x86-64 — REQUIRED by the vendored
# `sundials_rs` Windows port.
#
# `sundials_rs/crates/sundials_core/src/sundials_libm/` and the
# deterministic `pow` in `sundials_math.rs` reproduce the FMA-contracted
# build glibc ifunc-dispatches to on x86-64, so they use `f64::mul_add`
# in exactly the places that build fuses. `mul_add` lowers to
# `llvm.fma.f64`, and on the default `x86_64-pc-windows-msvc` target —
# whose baseline is SSE2, without FMA — LLVM cannot emit an instruction
# for it and calls the C runtime (`ucrtbase.dll`) instead. With the
# feature enabled it compiles to `vfmadd213sd`.
#
# The vendored workspace pins this flag for ITS OWN builds in
# `sundials_rs/.cargo/config.toml`, but cargo configuration is resolved
# from the directory the build is invoked in — a build of THIS workspace
# from THIS root would otherwise compile `sundials_core` without the
# feature. This file makes the requirement a property of the build here
# too, exactly as `sundials_libm.rs` (Preconditions) demands of every
# downstream crate.
#
# Consequence: binaries built from this workspace require a CPU with FMA
# (Intel Haswell 2013+, AMD Piledriver 2012+). The Intel Core Ultra 9
# 275HX this project targets has it.

[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-feature=+fma"]
