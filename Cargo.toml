[workspace]
resolver = "2"
members = [
    "quantum",
    "physical_object",
    "posim",
    "special_functions",
]
default-members = [
    "quantum","posim"]
# Vendored third-party code is a dependency, never a workspace member:
# excluding it keeps `cargo test --workspace` reporting OUR tests only,
# and stops upstream lint settings leaking into this workspace.
# See THIRD_PARTY.md for provenance.
# sundials_rs is a self-contained workspace vendored beneath this one.
# Without this exclude, cargo would absorb its crates into THIS workspace
# and they would inherit `version.workspace` from here (0.1.0) instead of
# their own 7.8.0 — silently misreporting the SUNDIALS version they port.
#
# rebound_rust and reboundx_rust are the same arrangement: two more
# self-contained workspaces (rebound_rs 5.1.1 and reboundx_rs 5.1.0)
# carried here so that a clone of this repository reproduces the exact
# directory layout their documentation describes. They are NOT
# dependencies of the simulator; reboundx_rs depends on rebound_rs by
# the relative path `../rebound_rust`, which is why they sit side by
# side at this root. Excluding them keeps `cargo test --workspace`
# reporting only this workspace's tests, and stops their own port
# versions being overwritten by `version.workspace` from here.
exclude = ["sundials_rs", "vendor/spec_math", "rebound_rust", "reboundx_rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[profile.release]
opt-level = 3
