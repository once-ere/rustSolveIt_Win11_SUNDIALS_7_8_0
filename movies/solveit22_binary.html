const BOX = null;

let cam = null;

  let lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity], pad = 0.5;
  const wall = new Set(BODIES.filter(b => b.wall).map(b => String(b.id)));

      if (s[k] > hi[k]) hi[k] = s[k];

let frame = 0, playing = false, speed = 1, lastTick = 0;
const scrub = document.getElementById("scrub");

function shapePoints(b, pos, q) {
  const gm = b.geom || {};
  switch (b.shape) {
    case "cuboid": {
      const [hx, hy, hz] = gm.half_extents || [0.5, 0.5, 0.5];
      const cs = [];
      for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {
        const w = qrot(q, [sx*hx, sy*hy, sz*hz]);
        cs.push([pos[0]+w[0], pos[1]+w[1], pos[2]+w[2]]);
      }
      const E = [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
      return { edges: E.map(([a, b2]) => [cs[a], cs[b2]]) };

    case "torus": {
      const R = gm.ring_radius || 1, r = gm.tube_radius || 0.3;

      const d1 = [qrot(q, [-r,0,0]), qrot(q, [r,0,0])].map(w => [pos[0]+w[0],pos[1]+w[1],pos[2]+w[2]]);

        const l2 = qrot(q, [r*Math.cos(a), r*Math.sin(a), -h]);

    for (const r of sp.rings || []) stroke(r, color, 1.4);
    for (const e of sp.edges || []) stroke(e, color, 1.4);
    for (const [c, r] of sp.discs || []) {
      const pr = project(c);
      if (!pr) continue;
      const rad = Math.max(1.5, r * pr[2]);
      const grad = g.createRadialGradient(pr[0]-rad/3, pr[1]-rad/3, rad/6, pr[0], pr[1], rad);
      grad.addColorStop(0, "#e8eef7"); grad.addColorStop(0.25, color); grad.addColorStop(1, "#10151c");
      g.fillStyle = grad;
      g.beginPath(); g.arc(pr[0], pr[1], rad, 0, 2 * Math.PI); g.fill();
    }
    if (document.getElementById("labels").checked) {
      const pr = project(d.pos);
      if (pr) {
        g.fillStyle = "#9fb0c6"; g.font = "11px sans-serif"; g.textAlign = "center";
        g.fillText(d.b.name, pr[0], pr[1] - 14);
      }
    }
  }
  const mag = v => Math.hypot(v[0], v[1], v[2]);
  document.getElementById("hud").textContent =
    `frame ${frame + 1}/${FRAMES.length}   t = ${f.t.toPrecision(8)}\n` +
    `E = ${f.E.toPrecision(8)}   |P| = ${mag(f.P).toPrecision(8)}   |L| = ${mag(f.L).toPrecision(8)}\n` +
    `collisions so far: ${f.n}`;
  scrub.value = frame;
}

/* ---- controls ---- */
function tick(now) {
  requestAnimationFrame(tick);
  if (playing && now - lastTick > 33 / speed) {
    lastTick = now;
    frame = (frame + 1) % FRAMES.length;
    draw();
  }
}
const playBtn = document.getElementById("play");
function setPlaying(p) { playing = p; playBtn.innerHTML = p ? "&#10073;&#10073;" : "&#9654;"; }
playBtn.onclick = () => setPlaying(!playing);
document.getElementById("back").onclick = () => { setPlaying(false); frame = (frame + FRAMES.length - 1) % FRAMES.length; draw(); };
document.getElementById("fwd").onclick = () => { setPlaying(false); frame = (frame + 1) % FRAMES.length; draw(); };
document.getElementById("home").onclick = () => { cam = { ...HOME, target: HOME.target.slice() }; draw(); };
document.getElementById("speed").onchange = e => { speed = parseFloat(e.target.value); };
scrub.oninput = () => { setPlaying(false); frame = +scrub.value; draw(); };
document.getElementById("trails").onchange = draw;
document.getElementById("labels").onchange = draw;
let dragging = false, lx = 0, ly = 0;
cv.addEventListener("pointerdown", e => { dragging = true; lx = e.clientX; ly = e.clientY; });
addEventListener("pointerup", () => { dragging = false; });
addEventListener("pointermove", e => {
  if (!dragging) return;
  cam.yaw += (e.clientX - lx) * 0.008;
  cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + (e.clientY - ly) * 0.008));
  lx = e.clientX; ly = e.clientY; draw();
});
addEventListener("wheel", e => { cam.dist *= e.deltaY > 0 ? 1.1 : 1 / 1.1; draw(); });
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === "ArrowLeft") { setPlaying(false); frame = (frame + FRAMES.length - 1) % FRAMES.length; draw(); }
  else if (e.key === "ArrowRight") { setPlaying(false); frame = (frame + 1) % FRAMES.length; draw(); }
  else if (e.key === "ArrowUp") { cam.ty -= 20; draw(); }
  else if (e.key === "ArrowDown") { cam.ty += 20; draw(); }
  else if (e.key === "+" || e.key === "=") { cam.dist /= 1.15; draw(); }
  else if (e.key === "-") { cam.dist *= 1.15; draw(); }
});
autoFit();
resize();
requestAnimationFrame(tick);
</script>
</body>
